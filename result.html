<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta charset="UTF-8">
    <title>定制结果 - 珍珠宇宙茶饮屋</title>
    <link rel="stylesheet" href="css/app.css">
    <link rel="icon" href="images/t.ico" type="image/x-icon">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 15px;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .result-img {
            width: 80%;
            max-width: 400px;
            height: auto;
            margin-bottom: 20px;
            object-fit: cover;
            border-radius: 10px;
        }
        .result-text {
            font-size: 20px;
            color: #333;
            margin-bottom: 20px;
            text-align: center;
            padding: 0 10px;
        }
        .btn {
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            min-height: 48px;
            min-width: 200px;
            transition: all 0.2s ease;
        }
        .success-btn {
            background: cornflowerblue;
            color: white;
        }
        .success-btn:hover {
            background: #5b92e5;
        }
        .fail-btn {
            background: deepskyblue;
            color: white;
        }
        .fail-btn:hover {
            background: #00bfff;
        }
        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 9999;
            display: none;
        }
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255,255,255,0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9998;
            display: none;
        }
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid cornflowerblue;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
<div class="loading-overlay" id="loadingOverlay">
    <div class="loading-spinner"></div>
</div>
<div class="toast" id="toast"></div>
<img id="resultImg" class="result-img" src="images/beijing.png" alt="结果图标" onerror="this.src='images/fail.jpg'">
<div id="resultText" class="result-text"></div>
<button id="actionBtn" class="btn" onclick="handleAction()"></button>

<audio id="clickSound" preload="auto" style="display: none;" onError="console.log('点击音效加载失败：', this.src)">
    <source src="audio/click.mp3" type="audio/mpeg">
</audio> 
<audio id="successSound" preload="auto" style="display: none;" onError="console.log('成功音效加载失败：', this.src)">
    <source src="audio/copy_C7219BE8-8750-4A67-8EDE-7E275DD5D39D_min.mp3" type="audio/mpeg">
</audio> 
<audio id="failSound" preload="auto" style="display: none;" onError="console.log('失败音效加载失败：', this.src)">
    <source src="audio/hei.mp3" type="audio/mpeg">
</audio> 

<script src="js/storage.js"></script>
<script src="js/common.js"></script>
<script src="js/components.js"></script>
<script src="js/logger.js"></script>

<script>
    // 1. 核心变量初始化 + 防重复控制锁
    const urlParams = new URLSearchParams(window.location.search);
    const status = urlParams.get('status') || 'fail';
    let hasUserInteracted = false; // 用户是否已交互（浏览器音频播放强制要求）
    let targetAudioId = status === 'success' ? 'successSound' : 'failSound';
    let isAudioPlaying = false; // 音频播放中锁
    let isBtnClicking = false; // 按钮点击中锁

    // 2. 页面交互标记（每次点击都触发，仅首次标记交互状态）
    function markInteracted() {
        // 首次点击标记为已交互（解锁浏览器音频播放限制）
        if (!hasUserInteracted) {
            hasUserInteracted = true;
            console.log('用户首次交互完成，解锁音频播放限制');
        }
        // 每次点击都执行音频播放（去掉原有return，不再仅执行一次）
        playResultSound(targetAudioId);
    }

    // 3. 音频播放逻辑（保留原有防重复播放）
    function playResultSound(audioId) {
        // 防重复播放：如果已有音频在播放，直接返回
        if (isAudioPlaying) return;
        
        const audio = document.getElementById(audioId);
        if (!audio) {
            console.log('音频元素不存在：', audioId);
            return;
        }

        // 播放前锁
        isAudioPlaying = true;
        // 强制重置播放起点（每次点击都从开头播放）
        audio.currentTime = 0;
        
        // 播放完成/失败后解锁
        const unlockAudio = () => {
            isAudioPlaying = false;
            audio.removeEventListener('ended', unlockAudio);
            audio.removeEventListener('error', unlockAudio);
        };
        audio.addEventListener('ended', unlockAudio);
        audio.addEventListener('error', unlockAudio);
        
        // 微信浏览器强制预加载音频
        const loadAndPlay = () => {
            audio.load();
            audio.oncanplay = function() {
                if (hasUserInteracted) {
                    audio.play().then(() => {
                        console.log('音频播放成功：', audioId);
                    }).catch(err => {
                        console.log('音频播放失败(微信兼容)：', audioId, err);
                        unlockAudio(); // 失败也要解锁
                        setTimeout(() => {
                            if (!isAudioPlaying) {
                                audio.currentTime = 0;
                                audio.play().catch(e => {
                                    console.log('重试播放失败：', audioId, e);
                                    unlockAudio();
                                });
                            }
                        }, 200);
                    });
                } else {
                    unlockAudio(); // 无交互则解锁
                }
            };
        };

        // 微信环境特殊处理
        if (/(MicroMessenger)/i.test(navigator.userAgent)) {
            loadAndPlay();
        } else {
            // 普通浏览器逻辑
            if (audio.readyState >= 2) {
                audio.play().catch(err => {
                    console.log('普通浏览器播放失败：', audioId, err);
                    unlockAudio();
                });
            } else {
                audio.addEventListener('canplaythrough', () => {
                    audio.play().catch(err => {
                        console.log('普通浏览器加载后播放失败：', audioId, err);
                        unlockAudio();
                    });
                }, { once: true });
            }
        }
    }

    // 4. 清空数据逻辑
    function clearCustomData() {
        try {
            Storage.remove("customDrink");
            console.log("已清空当前定制饮品数据，保留购物车数据");
        } catch (e) {
            console.log('清空数据失败：', e);
        }
    }

    // 5. 按钮点击逻辑（增加防重复点击）
    function handleAction() {
        // 防重复点击：如果正在点击中，直接返回
        if (isBtnClicking) return;
        isBtnClicking = true; // 点击锁
        
        try {
            // 播放点击音效（受isAudioPlaying控制，避免和结果音效冲突）
            playResultSound("clickSound");
            
            // 禁用按钮视觉反馈（可选）
            const actionBtn = document.getElementById('actionBtn');
            actionBtn.disabled = true;
            actionBtn.style.opacity = '0.7';
            actionBtn.style.cursor = 'not-allowed';

            // 跳转逻辑
            if (status === 'success') {
                typeof navigateTo === 'function' ? navigateTo("customize.html") : window.location.href = "customize.html";
            } else {
                clearCustomData();
                typeof navigateTo === 'function' ? navigateTo("index.html") : window.location.href = "index.html";
            }
        } catch (e) {
            console.log('按钮点击逻辑报错：', e);
            isBtnClicking = false; // 报错解锁
            // 恢复按钮状态
            const actionBtn = document.getElementById('actionBtn');
            actionBtn.disabled = false;
            actionBtn.style.opacity = '1';
            actionBtn.style.cursor = 'pointer';
        }
    }

    // 6. 初始化页面
    function initPage() {
        try {
            bindSoundToAllButtons();
        } catch (e) {
            console.log('绑定按钮音效失败：', e);
        }

        // 设置页面内容
        if (status === 'success') {
            document.getElementById("resultImg").src = "images/success.jpg";
            document.getElementById("resultText").innerText = "定制成功！";
            document.getElementById("actionBtn").innerText = "继续定制细节";
            document.getElementById("actionBtn").className = "btn success-btn";
        } else {
            document.getElementById("resultImg").src = "images/fail.jpg";
            document.getElementById("resultText").innerText = "这是黑暗料理，无法制作！";
            document.getElementById("actionBtn").innerText = "返回重新定制";
            document.getElementById("actionBtn").className = "btn fail-btn";
        }

        // 延迟播放音频（首次加载无用户交互，会失败，不影响后续点击）
        setTimeout(() => {
            playResultSound(targetAudioId);
        }, 100);
    }

    // 7. 全局监听所有点击/触摸事件（移除once，每次点击都触发）
    document.addEventListener('click', markInteracted);
    document.addEventListener('touchstart', markInteracted);

    // 8. 浏览器适配初始化（保留原有微信/普通浏览器兼容逻辑）
    if (/(MicroMessenger)/i.test(navigator.userAgent)) {
        function wxInit() {
            if (window.WeixinJSBridge && window.WeixinJSBridge.invoke) {
                initPage();
            } else {
                setTimeout(wxInit, 50);
            }
        }
        if (window.WeixinJSBridge) {
            wxInit();
        } else {
            document.addEventListener('WeixinJSBridgeReady', wxInit, { once: true });
        }
    } else {
        if (document.readyState === 'complete' || document.readyState === 'interactive') {
            initPage();
        } else {
            document.addEventListener('DOMContentLoaded', initPage, { once: true });
        }
    }
</script>
</body>
</html>
