<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta charset="UTF-8">
    <!-- 微信兼容meta：防止空白、优化渲染 -->
    <meta name="format-detection" content="telephone=no,email=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>定制结果 - 珍珠宇宙茶饮屋</title>
    <link rel="stylesheet" href="css/app.css">
    <link rel="icon" href="images/t.ico" type="image/x-icon">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 15px;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            /* 微信兜底背景，防止极端空白 */

        }
        .result-img {
            width: 80%;
            max-width: 400px;
            height: auto;
            margin-bottom: 20px;
            object-fit: cover;
            border-radius: 10px;
        }
        .result-text {
            font-size: 20px;
            color: #333;
            margin-bottom: 20px;
            text-align: center;
            padding: 0 10px;
        }
        .btn {
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            min-height: 48px;
            min-width: 200px;
            transition: all 0.2s ease;
            /* 微信按钮样式兼容 */
            -webkit-appearance: none;
        }
        .success-btn {
            background: cornflowerblue;
            color: white;
        }
        .success-btn:hover {
            background: #5b92e5;
        }
        .fail-btn {
            background: deepskyblue;
            color: white;
        }
        .fail-btn:hover {
            background: #00bfff;
        }
        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 9999;
            display: none;
        }
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255,255,255,0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9998;
            display: none;
        }
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid cornflowerblue;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
<div class="loading-overlay" id="loadingOverlay">
    <div class="loading-spinner"></div>
</div>
<div class="toast" id="toast"></div>
<img id="resultImg" class="result-img" src="images/beijing.png" alt="结果图标" onerror="this.src='images/fail.jpg'">
<div id="resultText" class="result-text"></div>
<button id="actionBtn" class="btn" onclick="handleAction()"></button>

<audio id="clickSound" preload="auto" style="display: none;" onError="console.log('点击音效加载失败：', this.src)">
    <source src="audio/click.mp3" type="audio/mpeg">
</audio> 
<audio id="successSound" preload="auto" style="display: none;" onError="console.log('成功音效加载失败：', this.src)">
    <source src="audio/copy_C7219BE8-8750-4A67-8EDE-7E275DD5D39D_min.mp3" type="audio/mpeg">
</audio> 
<audio id="failSound" preload="auto" style="display: none;" onError="console.log('失败音效加载失败：', this.src)">
    <source src="audio/hei.mp3" type="audio/mpeg">
</audio> 

<script src="js/storage.js"></script>
<script src="js/common.js"></script>
<script src="js/components.js"></script>
<script src="js/logger.js"></script>

<script>
    // 1. 核心变量（完全保留，新增微信环境标记）
    const urlParams = new URLSearchParams(window.location.search);
    const status = urlParams.get('status') || 'fail';
    const isWechat = /(MicroMessenger)/i.test(navigator.userAgent); // 微信标记
    let hasUserInteracted = false; // 兼容直接打开结果页的场景
    const targetAudio = document.getElementById(status === 'success' ? 'successSound' : 'failSound');
    const clickAudio = document.getElementById('clickSound');
    let isBtnClicking = false;

    // 2. 提示框方法（微信兼容）
    function showToast(text, duration = 2000) {
        const toast = document.getElementById('toast');
        if (!toast) return;
        toast.innerText = text;
        toast.style.display = 'block';
        clearTimeout(window.toastTimer);
        window.toastTimer = setTimeout(() => {
            toast.style.display = 'none';
        }, duration);
    }

    // 3. 极简音频播放（跨浏览器+微信兼容，重置起点保证从头播）
    function playAudio(audioDom) {
        if (!audioDom) return;
        audioDom.currentTime = 0; // 每次播放都从头开始
        audioDom.play().catch(err => {
            console.log('音效播放失败：', err);
            !hasUserInteracted && showToast('点击页面解锁音效');
        });
    }

    // 4. 封装播放方法
    function playResultAudio() { playAudio(targetAudio); }
    function playClickAudio() { playAudio(clickAudio); }

    // 5. 清空数据逻辑（完全保留）
    function clearCustomData() {
        try {
            Storage.remove("customDrink");
            console.log("已清空当前定制饮品数据，保留购物车数据");
        } catch (e) {
            console.log('清空数据失败：', e);
            showToast('数据清空失败，请重试');
        }
    }

    // 6. 按钮点击逻辑（完全保留，仅优化微信延迟跳转）
    function handleAction() {
        if (isBtnClicking) return;
        isBtnClicking = true;
        
        try {
            playClickAudio(); // 播放点击音效
            const actionBtn = document.getElementById('actionBtn');
            actionBtn.disabled = true;
            actionBtn.style.opacity = '0.7';
            actionBtn.style.cursor = 'not-allowed';

            // 微信延迟200ms跳转，确保音效播放完成
            const delay = isWechat ? 200 : 0;
            setTimeout(() => {
                if (status === 'success') {
                    typeof navigateTo === 'function' ? navigateTo("customize.html") : window.location.href = "customize.html";
                } else {
                    clearCustomData();
                    typeof navigateTo === 'function' ? navigateTo("index.html") : window.location.href = "index.html";
                }
            }, delay);
        } catch (e) {
            console.log('按钮点击逻辑报错：', e);
            isBtnClicking = false;
            const actionBtn = document.getElementById('actionBtn');
            actionBtn.disabled = false;
            actionBtn.style.opacity = '1';
            actionBtn.style.cursor = 'pointer';
        }
    }

    // 7. 初始化页面（★核心新增：页面加载完成后自动播放对应音频★）
    function initPage() {
        try {
            bindSoundToAllButtons();
        } catch (e) {
            console.log('绑定按钮音效失败：', e);
        }

        // 原有页面内容设置（完全保留，无修改）
        if (status === 'success') {
            document.getElementById("resultImg").src = "images/success.jpg";
            document.getElementById("resultText").innerText = "定制成功！";
            document.getElementById("actionBtn").innerText = "继续定制细节";
            document.getElementById("actionBtn").className = "btn success-btn";
        } else {
            document.getElementById("resultImg").src = "images/fail.jpg";
            document.getElementById("resultText").innerText = "这是黑暗料理，无法制作！";
            document.getElementById("actionBtn").innerText = "返回重新定制";
            document.getElementById("actionBtn").className = "btn fail-btn";
        }

        // ★★★ 核心新增：页面初始化后，自动播放对应结果音频 ★★★
        playResultAudio();
        // 标记为已交互（因step4已完成点击，此处直接解锁）
        hasUserInteracted = true;
    }

    // 8. 全局交互事件（保留：单击页面可多次重播音频）
    function handlePageInteract() {
        playResultAudio(); // 每次点击都重播，从头开始
        hasUserInteracted = true;
    }
    document.addEventListener('click', handlePageInteract);
    document.addEventListener('touchstart', handlePageInteract, { passive: true }); // 手机/微信兼容

    // 9. 浏览器适配初始化（微信+普通浏览器，确保不空白、自动播生效）
    if (isWechat) {
        function wxInit() {
            if (window.WeixinJSBridge) {
                initPage(); // 微信桥接完成后初始化，确保自动播
            } else {
                setTimeout(wxInit, 50);
            }
        }
        wxInit();
        document.addEventListener('WeixinJSBridgeReady', wxInit, { once: true });
        // 微信极端情况：300ms后强制初始化，防止监听失败
        setTimeout(initPage, 300);
    } else {
        if (document.readyState === 'complete' || document.readyState === 'interactive') {
            initPage();
        } else {
            document.addEventListener('DOMContentLoaded', initPage, { once: true });
        }
        // 普通浏览器加载完成后再确认初始化
        window.addEventListener('load', initPage, { once: true });
    }
</script>
</body>
</html>
