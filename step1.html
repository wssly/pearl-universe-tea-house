<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta charset="UTF-8">
    <title>请选择杯底 - 珍珠宇宙茶饮屋</title>
    <link rel="stylesheet" href="css/app.css">
    <link rel="icon" href="images/t.ico" type="image/x-icon">
    <style>
        body {
            padding-bottom: 200px;
            padding-left: 10px;
            padding-right: 10px;
            padding-top: 40px;
        }
.title-img-container {
    display: flex;
    align-items:flex-start; 
    justify-content: space-between;
    width: 100%;
    margin: 30px 0 5px 0;
    padding: 0 5px;
}

.title-extra-img {
    width: 102px; 
    height: 102px; 
    object-fit: contain;
    border-radius: 8px;
    margin-top: -16px; 
}
.title-top-img {
    width: 70px;
    height: 70px;
    object-fit: contain;
}

        .step-title {
            text-align: left;
            font-size: 18px;
            margin: 10px 0 20px 0;
            color: #333;
            font-weight: 600;
        }
        .prev-btn, .next-btn {
            min-height: 50px;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 8px;
            border: none;
            width: 140px;
        }
        .next-btn {
            background: #6ACDE3;
            color: white;
        }
        .next-btn:disabled {
            background: #ccc !important;
            color: #999;
            cursor: not-allowed;
        }
        .prev-btn {
            background: white;
            border: 1px solid #A1CEF8;
            color: #2A5987;
        }
    </style>
</head>
<body>
<!-- 加载弹窗 -->
<div class="loading-overlay" id="loadingOverlay">
    <div class="loading-spinner"></div>
</div>

<!-- 提示弹窗 -->
<div class="toast" id="toast"></div>

<div class="title-img-container">
    <img src="images/math/数字1.png" alt="标题上方图片" class="title-top-img" loading="lazy" onerror="this.src='images/beijing.png'">
    <img src="images/logoo.png" alt="附加图标" class="title-extra-img" loading="lazy" onerror="this.src='images/beijing.png'">
</div>

<div class="step-title">请选择杯底 🧋（必选）</div>

<div class="option-grid">
    <div class="option-item" onclick="selectOption(this, '奶茶')">
        <img src="images/drinks/zzzn.jpg" alt="奶茶" loading="lazy" onerror="this.src='images/beijing.png'">
        <span>奶茶</span>
    </div>
    <div class="option-item" onclick="selectOption(this, '姜茶')">
        <img src="images/drinks/jcc.jpg" alt="姜茶" loading="lazy" onerror="this.src='images/beijing.png'">
        <span>姜茶</span>
    </div>
    <div class="option-item" onclick="selectOption(this, '美式')">
        <img src="images/drinks/m.png" alt="美式" loading="lazy" onerror="this.src='images/beijing.png'">
        <span>美式</span>
    </div>
    <div class="option-item" onclick="selectOption(this, '红茶')">
        <img src="images/drinks/h.png" alt="红茶" loading="lazy" onerror="this.src='images/beijing.png'">
        <span>红茶</span>
    </div>
    
    <div class="option-item" onclick="selectOption(this, '果茶')">
        <img src="images/drinks/g.png" alt="果茶" loading="lazy" onerror="this.src='images/beijing.png'">
        <span>果茶</span>
    </div>
    <div class="option-item" onclick="selectOption(this, '绿茶')">
        <img src="images/drinks/l.png" alt="绿茶" loading="lazy" onerror="this.src='images/beijing.png'">
        <span>绿茶</span>
    </div>

</div>

<div class="selected-area">
    <div class="selected-text" id="selectedText">已选：无</div>
</div>

<div class="footer-bar">
    <button class="prev-btn" onclick="navigateTo('index.html')">返回</button>
    <button class="next-btn" id="nextBtn" onclick="goToNextStep()" disabled>下一步</button>
</div>

<!-- 音效 -->
<audio id="clickSound" preload="auto" style="display: none;">
    <source src="audio/click.mp3" type="audio/mpeg">
</audio>


<!-- 公共脚本 -->
<script src="js/storage.js"></script>
<script src="js/common.js"></script>
<script src="js/components.js"></script>
<script src="js/logger.js"></script>

<script>
    let selectedBase = "";

    // 选择杯底
    function selectOption(item, name) {
        document.querySelectorAll(".option-item").forEach(i => i.classList.remove("selected"));
        item.classList.add("selected");
        selectedBase = name;
        updateSelectedText();
        document.getElementById("nextBtn").disabled = false;
    }

    // 更新已选文本（带XSS防护）
    function updateSelectedText() {
        const text = selectedBase ? `杯底：${escapeHtml(selectedBase)}` : "已选：无";
        document.getElementById("selectedText").innerText = text;
    }

    // 跳转到下一步
    function goToNextStep() {
        let drink = Storage.get("customDrink") || {};
        drink.base = selectedBase;
        Storage.set("customDrink", drink);
        navigateTo("step2.html");
    }

    // 初始化
    window.addEventListener('DOMContentLoaded', function() {
        // 兼容Array.includes
        if (!Array.prototype.includes) {
            Array.prototype.includes = function(searchElement) {
                return this.indexOf(searchElement) !== -1;
            };
        }

        // 读取已选数据
        const drink = Storage.get("customDrink");
        if (drink?.base) {
            selectedBase = drink.base;
            document.querySelectorAll(".option-item").forEach(item => {
                if (item.querySelector('span').textContent === selectedBase) {
                    item.classList.add("selected");
                }
            });
            document.getElementById("nextBtn").disabled = false;
            updateSelectedText();
        }

        // 绑定音效
        bindSoundToAllButtons();
    });
</script>
</body>
</html>
